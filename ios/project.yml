name: CopilotProjects
options:
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  CopilotProjectsPackage:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: M32S59L6U6
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
targets:
  CopilotProjects:
    type: application
    platform: iOS
    sources:
      - CopilotProjects
    dependencies:
      - package: CopilotProjectsPackage
        product: CopilotProjectsProtocol
    info:
      path: CopilotProjects/Info.plist
      properties:
        CFBundleDisplayName: Copilot Projects
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.sirfergy.copilotprojects
            CFBundleURLSchemes:
              - copilot-projects
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: CopilotProjects/CopilotProjects.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirfergy.copilotprojects
        PRODUCT_NAME: Copilot Projects
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  CopilotProjectsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CopilotProjectsTests
    dependencies:
      - target: CopilotProjects
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirfergy.copilotprojects.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Copilot Projects.app/Copilot Projects"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CopilotProjects:
    build:
      targets:
        CopilotProjects: all
        CopilotProjectsTests: [test]
    test:
      targets:
        - CopilotProjectsTests
