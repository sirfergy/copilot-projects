name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example, 0.3.1 or v0.3.1)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    outputs:
      previous_sha: ${{ steps.release.outputs.previous_sha }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      version: ${{ steps.release.outputs.version }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure runner PATH
        run: printf '%s\n' /opt/homebrew/bin /usr/local/bin >> "$GITHUB_PATH"

      - name: Validate release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main (got $GITHUB_REF)." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            if ! triggering_pull_requests="$(
              gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            )"; then
              echo "Could not verify PR provenance for $GITHUB_SHA." >&2
              exit 1
            fi
            if ! jq -e --arg sha "$GITHUB_SHA" \
              'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)' \
              <<< "$triggering_pull_requests" >/dev/null; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Skipped: $GITHUB_SHA was not created by a PR merge to main." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch origin main --quiet
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Refusing to release $GITHUB_SHA because it is no longer on main." >&2
              exit 1
            fi
            latest_tag="$(
              git tag --list 'v*' --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | head -1 || true
            )"
            if [[ -z "$latest_tag" ]]; then
              echo "No semantic-version release tag exists to increment." >&2
              exit 1
            fi
            expected_asset="Copilot-Projects-${latest_tag#v}.dmg"
            if ! latest_release="$(
              gh release view "$latest_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets,isDraft,publishedAt \
            )"; then
              echo "Could not inspect release metadata for $latest_tag." >&2
              exit 1
            fi
            if ! jq -e --arg asset "$expected_asset" \
              '.isDraft == false
               and .publishedAt != null
               and any(.assets[]; .name == $asset and .size > 0)' \
              <<< "$latest_release" >/dev/null; then
              echo "Latest tag $latest_tag is not a complete published release." >&2
              echo "Delete the incomplete release/tag and retry." >&2
              exit 1
            fi
            latest_sha="$(git rev-list -n 1 "$latest_tag")"
            if git merge-base --is-ancestor "$GITHUB_SHA" "$latest_sha"; then
              if ! git merge-base --is-ancestor "$latest_sha" origin/main; then
                echo "Latest release $latest_tag is not on main." >&2
                exit 1
              fi
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Skipped: $GITHUB_SHA is already contained in $latest_tag." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$latest_sha" "$GITHUB_SHA"; then
              echo "Latest release $latest_tag is on a divergent history." >&2
              exit 1
            fi
            echo "previous_sha=$latest_sha" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"
            current="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$current"
            version="$major.$minor.$((10#$patch + 1))"
          else
            version="${INPUT_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z (optionally prefixed with v)." >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists in $GITHUB_REPOSITORY." >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: steps.release.outputs.should_release == 'true'
        run: swift test

  release:
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure runner PATH
        run: printf '%s\n' /opt/homebrew/bin /usr/local/bin >> "$GITHUB_PATH"

      - name: Configure release credentials
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_P12_BASE64:?release environment secret MACOS_DEVELOPER_ID_P12_BASE64 is required}"
          : "${DEVELOPER_ID_P12_PASSWORD:?release environment secret MACOS_DEVELOPER_ID_P12_PASSWORD is required}"
          : "${NOTARY_KEY_P8_BASE64:?release environment secret APPLE_NOTARY_KEY_P8_BASE64 is required}"
          : "${NOTARY_KEY_ID:?release environment secret APPLE_NOTARY_KEY_ID is required}"
          : "${NOTARY_ISSUER_ID:?release environment secret APPLE_NOTARY_ISSUER_ID is required}"

          umask 077
          keychain_path="$RUNNER_TEMP/copilot-projects-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 -D > "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -x
          rm -f "$certificate_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="${existing_keychain#\"}"
            existing_keychain="${existing_keychain%\"}"
            [ -z "$existing_keychain" ] || existing_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          xcrun notarytool store-credentials copilot-projects-release \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain_path"
          rm -f "$notary_key_path"

          identities="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p'
          )"
          identity_count="$(
            printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' '
          )"
          if [ "$identity_count" != "1" ]; then
            echo "Expected exactly one Developer ID Application identity, found $identity_count." >&2
            exit 1
          fi

          {
            echo "codesign_identity=$identities"
            echo "keychain_path=$keychain_path"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_PREVIOUS_SHA: ${{ needs.validate.outputs.previous_sha }}
          EXPECTED_PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          GH_TOKEN: ${{ github.token }}
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.codesign_identity }}
          NOTARY_PROFILE: copilot-projects-release
          NOTARY_KEYCHAIN: ${{ steps.signing.outputs.keychain_path }}
        run: ./scripts/release.sh "$VERSION" --publish

      - name: Remove release credentials
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8"
          remaining_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="${existing_keychain#\"}"
            existing_keychain="${existing_keychain%\"}"
            if [ "$existing_keychain" != "$RUNNER_TEMP/copilot-projects-signing.keychain-db" ]; then
              remaining_keychains+=("$existing_keychain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${remaining_keychains[@]}" 2>/dev/null || true
          security delete-keychain \
            "$RUNNER_TEMP/copilot-projects-signing.keychain-db" 2>/dev/null || true