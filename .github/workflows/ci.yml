name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    # About twice the slowest healthy run, so a hung test frees the shared runner.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: Find changes to the script tests' inputs
        id: scripts
        # Only a pull_request checkout is a merge commit whose first parent is the base. On
        # workflow_dispatch, or when the diff fails, the output stays unset and the tests run.
        if: github.event_name == 'pull_request'
        run: |
          if changed="$(git diff --name-only HEAD^1 HEAD -- scripts .github vendor/dtach)" \
            && [[ -z "$changed" ]]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi
      # These two steps read only scripts/, .github/ and vendor/dtach.
      - name: Release entrypoint contracts
        if: steps.scripts.outputs.unchanged != 'true'
        run: |
          python3 scripts/test-release.py
          python3 scripts/test-release-notes.py
          python3 .github/skills/coordinate-copilot-sessions/tests/test_coordinator.py
      - name: Terminal reattachment under backpressure
        if: steps.scripts.outputs.unchanged != 'true'
        run: python3 scripts/test-dtach.py
      - name: Pure session rules
        run: swift test --package-path Packages/SessionDomain
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Tracker assets and contracts
        run: PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" ./scripts/check-tracker.sh
      - name: Test
        run: swift test
      - name: Release session-close and notifications tests
        run: swift test -c release --filter 'SessionCloseIntegrationTests|NotificationsTests'