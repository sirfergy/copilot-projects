name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - name: Pure session rules
        run: swift test --package-path Packages/SessionDomain
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: JavaScript assets and contracts
        run: PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" ./scripts/check-web-assets.sh
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release